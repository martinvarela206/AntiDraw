name: AntiDraw Release & Packaging Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      pre_release:
        description: 'Publish as Pre-Release (Beta Channel)'
        required: true
        type: boolean
        default: false

jobs:
  package-and-release:
    name: Package VSIX & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.20.0
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Full Quality Gate (Lint & Tests)
        run: |
          pnpm run lint
          pnpm test

      - name: Build Production Bundle (Sourcemaps Excluded)
        run: pnpm run build:prod

      - name: Package VSIX (Release or Pre-Release)
        id: package_step
        shell: bash
        run: |
          IS_PRE="${{ github.event.inputs.pre_release }}"
          # If triggered by a tag containing 'beta', 'alpha', or 'preview', automatically set pre-release
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" =~ (beta|alpha|preview|rc) ]]; then
            IS_PRE="true"
          fi

          if [ "$IS_PRE" = "true" ]; then
            echo "Packaging as Pre-Release (--pre-release)..."
            pnpm run package:pre-release
            echo "is_pre_release=true" >> $GITHUB_OUTPUT
          else
            echo "Packaging as Production Release..."
            pnpm run package
            echo "is_pre_release=false" >> $GITHUB_OUTPUT
          fi

          VSIX_FILE=$(ls *.vsix | head -n 1)
          echo "vsix_file=$VSIX_FILE" >> $GITHUB_OUTPUT
          echo "Packaged VSIX: $VSIX_FILE"

      - name: Upload VSIX Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_step.outputs.vsix_file }}
          path: ${{ steps.package_step.outputs.vsix_file }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package_step.outputs.vsix_file }}
          prerelease: ${{ steps.package_step.outputs.is_pre_release == 'true' }}
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ "${{ steps.package_step.outputs.is_pre_release }}" = "true" ]; then
            npx vsce publish --pre-release --packagePath ${{ steps.package_step.outputs.vsix_file }}
          else
            npx vsce publish --packagePath ${{ steps.package_step.outputs.vsix_file }}
          fi

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/v') && env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npx ovsx publish ${{ steps.package_step.outputs.vsix_file }}
